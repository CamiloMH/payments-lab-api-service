services:
  postgres:
    image: postgres:16-alpine
    container_name: payments-lab-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-payments_lab}
      POSTGRES_USER: ${DB_USER:-payments}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payments_pass}
    # 5433 en el host para no chocar con otros proyectos ni instalaciones locales (5432).
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-payments} -d ${DB_NAME:-payments_lab}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
